<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description"
        content="ConnectMe - a community social app built with Flutter, Clean Architecture and Firebase.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ConnectMe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ConnectMe</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API (web only). Key is safe in this file because
       the web build is deployed to Firebase Hosting; restrict the key in
       Google Cloud Console to your hosting domain. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBHjoOQUacnfJTJfwlY3assyrrLH2dFLsA&v=weekly" async defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F5F6F8;
      /* Brand gradient shown while the Flutter engine boots. */
      background-image: linear-gradient(180deg, #888BF4 0%, #5151C6 100%);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
