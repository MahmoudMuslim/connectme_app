org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler occasionally fails to close its `.tab` caches
# on Windows (`Could not close incremental caches`), which breaks the release
# build. Disabling incremental Kotlin compilation is the documented workaround
# and only costs a few seconds on a clean build.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process